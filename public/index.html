<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Old Eden</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #c8b89a;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: none;
    }

    /* ── Title Screen ─────────────────────────────── */
    #title-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at center, #1a1510 0%, #0a0a0a 70%);
      z-index: 100;
      cursor: default;
    }
    #title-screen h1 {
      font-size: 4rem;
      color: #d4a856;
      text-shadow: 0 0 40px rgba(212,168,86,0.5), 0 0 80px rgba(212,168,86,0.2);
      letter-spacing: 0.25em;
      margin-bottom: 0.3rem;
    }
    #title-screen .sub {
      color: #887755;
      font-style: italic;
      font-size: 1.15rem;
      margin-bottom: 3rem;
    }
    .menu-btn {
      display: block;
      width: 300px;
      padding: 15px 0;
      margin: 8px 0;
      background: linear-gradient(135deg, #1a1a1a, #222);
      border: 1px solid #333;
      border-radius: 8px;
      color: #d4a856;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.06em;
      font-family: inherit;
    }
    .menu-btn:hover {
      background: linear-gradient(135deg, #2a2218, #332a1a);
      border-color: #d4a856;
      box-shadow: 0 0 25px rgba(212,168,86,0.2);
      transform: scale(1.04);
    }
    .version-label {
      position: fixed;
      bottom: 12px;
      right: 16px;
      color: #333;
      font-size: 0.75rem;
      z-index: 200;
    }

    /* ── HUD Overlay ──────────────────────────────── */
    #hud-canvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* ── 3D Canvas ────────────────────────────────── */
    #game-canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ── Click-to-lock prompt ─────────────────────── */
    #lock-prompt {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    #lock-prompt span {
      color: #d4a856;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 20px rgba(212,168,86,0.4);
    }
  </style>
</head>
<body>

  <!-- ── Title Screen ──────────────────────────── -->
  <div id="title-screen">
    <h1>OLD EDEN</h1>
    <p class="sub">A world that remembers</p>
    <button class="menu-btn" id="btn-start">&#9876; Enter Gunner Mode</button>
    <div style="margin-top:1.5rem;color:#555;font-size:0.8rem" id="server-status">Connecting&#8230;</div>
  </div>

  <!-- ── Game Canvases ─────────────────────────── -->
  <canvas id="game-canvas"></canvas>
  <canvas id="hud-canvas"></canvas>

  <!-- ── Pointer lock prompt ───────────────────── -->
  <div id="lock-prompt"><span>Click to resume control</span></div>

  <div class="version-label">Old Eden v0.1.0-alpha</div>

  <!-- ── Three.js from CDN (r163) ──────────────── -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ================================================================
    //  CONFIG
    // ================================================================
    const SPAWN_RADIUS   = 250;
    const SPAWN_INTERVAL = 2200;
    const ENEMY_SPEED    = 18;
    const NAIL_SPEED     = 400;
    const MAX_AMMO       = 24;
    const CHARGE_TIME    = 600;
    const COOLDOWN_TIME  = 400;
    const MOUSE_SENS     = 0.002;
    const MAX_PITCH      = 1.2;
    const MAX_YAW        = 1.5;

    // ================================================================
    //  STATE
    // ================================================================
    let yaw = 0, pitch = 0;
    let ammo = MAX_AMMO;
    let hp = 100, maxHp = 100;
    let shield = 100, maxShield = 100;
    let score = 0, kills = 0, cycle = 1;
    let weaponReady = true;
    let charging = false, chargeStart = 0, chargeLevel = 0;
    let cooling = false, coolEnd = 0;
    let recoilOffset = 0, recoilVel = 0;
    let heat = 0;
    let running = false;
    let locked = false;

    const enemies = [];
    const projectiles = [];
    const explosions = [];
    const logLines = [];
    let nextEnemyId = 0;
    let nextProjId = 0;
    let gameTime = 0;
    let lastSpawn = 0;

    // ================================================================
    //  SERVER CHECK
    // ================================================================
    fetch('/health').then(r => r.json()).then(d => {
      document.getElementById('server-status').textContent =
        '\u25CF Server online \u2014 uptime ' + Math.floor(d.uptime) + 's';
      document.getElementById('server-status').style.color = '#4caf50';
    }).catch(() => {
      document.getElementById('server-status').textContent = '\u25CB Server offline';
      document.getElementById('server-status').style.color = '#c0392b';
    });

    // ================================================================
    //  THREE.JS SETUP
    // ================================================================
    const canvas3d = document.getElementById('game-canvas');
    const hudCanvas = document.getElementById('hud-canvas');
    const hudCtx = hudCanvas.getContext('2d');

    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000010, 0.00025);

    const camera = new THREE.PerspectiveCamera(75, 1, 0.01, 50000);
    camera.position.set(0, 0, 0);

    // Lighting
    scene.add(new THREE.AmbientLight(0x112244, 0.7));
    const starLight = new THREE.DirectionalLight(0xfff5e0, 2.0);
    starLight.position.set(500, 200, 300);
    scene.add(starLight);
    const fillLight = new THREE.DirectionalLight(0x4466aa, 0.4);
    fillLight.position.set(-300, -100, -200);
    scene.add(fillLight);

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      hudCanvas.width = w;
      hudCanvas.height = h;
    }
    window.addEventListener('resize', resize);
    resize();

    // ================================================================
    //  STARFIELD
    // ================================================================
    const starCount = 4000;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    const starSizes = new Float32Array(starCount);
    for (let i = 0; i < starCount; i++) {
      const r = 500 + Math.random() * 9500;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      starPos[i*3+2] = r * Math.cos(phi);
      starSizes[i] = 1 + Math.random() * 3;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
    const starMat = new THREE.PointsMaterial({
      color: 0xccbbaa, size: 2, sizeAttenuation: true, transparent: true, opacity: 0.8,
    });
    scene.add(new THREE.Points(starGeo, starMat));

    // Distant nebula planes
    for (let i = 0; i < 3; i++) {
      const nebGeo = new THREE.PlaneGeometry(3000, 3000);
      const nebMat = new THREE.MeshBasicMaterial({
        color: [0x1a0a2e, 0x0a1a2e, 0x2e0a1a][i],
        transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false,
      });
      const neb = new THREE.Mesh(nebGeo, nebMat);
      neb.position.set(
        (Math.random()-0.5)*5000,
        (Math.random()-0.5)*3000,
        -3000 - i*2000
      );
      neb.rotation.set(Math.random(), Math.random(), Math.random());
      scene.add(neb);
    }

    // ================================================================
    //  SHIP (PlaceholderShip style)
    // ================================================================
    const ship = new THREE.Group();
    ship.name = 'player-ship';
    const hullMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.6, metalness: 0.4 });
    const accentMat = new THREE.MeshStandardMaterial({
      color: 0x44aaff, roughness: 0.3, metalness: 0.6,
      emissive: 0x44aaff, emissiveIntensity: 0.3,
    });
    const shipCanopyMat = new THREE.MeshStandardMaterial({
      color: 0x88ccff, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.35,
    });
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.4, metalness: 0.7 });

    // Hull
    ship.add(new THREE.Mesh(new THREE.BoxGeometry(3,1,10), hullMat));
    // Nose
    const nose = new THREE.Mesh(new THREE.ConeGeometry(1.5,4,4), hullMat);
    nose.rotation.x = Math.PI/2; nose.position.z = -7; ship.add(nose);
    // Wings
    const wingGeo = new THREE.BoxGeometry(8,0.15,4);
    const wL = new THREE.Mesh(wingGeo, hullMat); wL.position.set(-4.5,0,1); wL.rotation.z=-0.08; ship.add(wL);
    const wR = new THREE.Mesh(wingGeo, hullMat); wR.position.set(4.5,0,1); wR.rotation.z=0.08; ship.add(wR);
    // Fins
    const finGeo = new THREE.BoxGeometry(0.15,1.5,2);
    const fL = new THREE.Mesh(finGeo, accentMat); fL.position.set(-8.4,0.6,1); ship.add(fL);
    const fR = new THREE.Mesh(finGeo, accentMat); fR.position.set(8.4,0.6,1); ship.add(fR);
    // Tail fins
    const tfGeo = new THREE.BoxGeometry(0.15,2,2.5);
    const tL = new THREE.Mesh(tfGeo, hullMat); tL.position.set(-1.2,1.2,4.5); tL.rotation.z=0.15; ship.add(tL);
    const tR = new THREE.Mesh(tfGeo, hullMat); tR.position.set(1.2,1.2,4.5); tR.rotation.z=-0.15; ship.add(tR);
    // Engines
    const eGeo = new THREE.CylinderGeometry(0.5,0.7,2,8);
    const eL = new THREE.Mesh(eGeo, accentMat); eL.rotation.x=Math.PI/2; eL.position.set(-1,-0.2,5.5); ship.add(eL);
    const eR = new THREE.Mesh(eGeo, accentMat); eR.rotation.x=Math.PI/2; eR.position.set(1,-0.2,5.5); ship.add(eR);
    // Engine glow
    const glowGeo = new THREE.CircleGeometry(0.65,16);
    const glowMat = new THREE.MeshBasicMaterial({ color:0x44aaff, transparent:true, opacity:0.7 });
    const gL = new THREE.Mesh(glowGeo, glowMat); gL.position.set(-1,-0.2,6.51); ship.add(gL);
    const gR = new THREE.Mesh(glowGeo, glowMat); gR.position.set(1,-0.2,6.51); ship.add(gR);
    // Canopy
    const canGeo = new THREE.SphereGeometry(1,16,12,0,Math.PI*2,0,Math.PI/2);
    const canMesh = new THREE.Mesh(canGeo, shipCanopyMat); canMesh.position.set(0,0.5,-3); ship.add(canMesh);
    // Turret base
    const tbGeo = new THREE.CylinderGeometry(0.6,0.7,0.4,8);
    const tb = new THREE.Mesh(tbGeo, gunMat); tb.position.set(0,0.8,-1); ship.add(tb);
    // Gun barrels
    const bbGeo = new THREE.CylinderGeometry(0.08,0.08,3,6);
    const bL = new THREE.Mesh(bbGeo, gunMat); bL.rotation.x=Math.PI/2; bL.position.set(-0.25,0.95,-2.5); ship.add(bL);
    const bR = new THREE.Mesh(bbGeo, gunMat); bR.rotation.x=Math.PI/2; bR.position.set(0.25,0.95,-2.5); ship.add(bR);

    // Turret mount
    const turretMount = new THREE.Object3D();
    turretMount.position.set(0, 1.2, -0.5);
    ship.add(turretMount);

    scene.add(ship);

    // ================================================================
    //  COCKPIT (attached to camera)
    // ================================================================
    const cockpit = new THREE.Group();
    cockpit.name = 'gunner-cockpit';

    // Glass canopy
    const cpCanopyMat = new THREE.MeshBasicMaterial({
      color: 0x88ccff, transparent: true, opacity: 0.06, side: THREE.FrontSide, depthWrite: false,
    });
    const cpCanopyGeo = new THREE.SphereGeometry(3.0, 32, 24, 0, Math.PI*2, 0, Math.PI*0.6);
    const cpCanopy = new THREE.Mesh(cpCanopyGeo, cpCanopyMat);
    cpCanopy.position.set(0, 0, -2.5);
    cpCanopy.rotation.x = Math.PI;
    cockpit.add(cpCanopy);

    // Canopy frame struts
    const frameMat = new THREE.MeshBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.5 });
    for (let i = 0; i < 6; i++) {
      const angle = (i/6)*Math.PI*2;
      const sGeo = new THREE.CylinderGeometry(0.015, 0.015, 3.5, 4);
      const strut = new THREE.Mesh(sGeo, frameMat);
      strut.position.set(Math.sin(angle)*2.8, Math.cos(angle)*2.0, -3.0);
      strut.rotation.x = Math.PI*0.3;
      strut.rotation.z = angle;
      cockpit.add(strut);
    }

    // Seat
    const seatMat = new THREE.MeshBasicMaterial({ color: 0x2a3540, transparent: true, opacity: 0.7 });
    const sBack = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.6,0.08), seatMat);
    sBack.position.set(0,-0.1,0.4); cockpit.add(sBack);
    const sBase = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.08,0.5), seatMat);
    sBase.position.set(0,-0.5,0.1); cockpit.add(sBase);
    const armGeo = new THREE.BoxGeometry(0.1,0.08,0.4);
    const armL = new THREE.Mesh(armGeo, seatMat); armL.position.set(-0.35,-0.35,0); cockpit.add(armL);
    const armR2 = new THREE.Mesh(armGeo, seatMat); armR2.position.set(0.35,-0.35,0); cockpit.add(armR2);
    const pivotGeo = new THREE.CylinderGeometry(0.08,0.12,0.3,8);
    const piv = new THREE.Mesh(pivotGeo, frameMat); piv.position.set(0,-0.75,0.1); cockpit.add(piv);

    // Railgun barrels (visible from cockpit)
    const railMat = new THREE.MeshBasicMaterial({ color: 0x556677, transparent: true, opacity: 0.8 });
    const railGlowMatL = new THREE.MeshBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0 });
    const railGlowMatR = new THREE.MeshBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0 });
    const railL = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,4,6), railMat);
    railL.rotation.x = Math.PI/2; railL.position.set(-0.18,-0.3,-2.0); cockpit.add(railL);
    const railR = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,4,6), railMat);
    railR.rotation.x = Math.PI/2; railR.position.set(0.18,-0.3,-2.0); cockpit.add(railR);
    // Rail glow
    const rgL = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,4,6), railGlowMatL);
    rgL.rotation.x = Math.PI/2; rgL.position.set(-0.18,-0.3,-2.0); cockpit.add(rgL);
    const rgR = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,4,6), railGlowMatR);
    rgR.rotation.x = Math.PI/2; rgR.position.set(0.18,-0.3,-2.0); cockpit.add(rgR);

    // Muzzle flash
    const muzzleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
    const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8), muzzleMat);
    muzzle.position.set(0,-0.3,-4.2); cockpit.add(muzzle);

    // Side instrument panels
    const panelMat = new THREE.MeshBasicMaterial({ color: 0x1a2030, transparent: true, opacity: 0.6 });
    const panelLMesh = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.8,1.2), panelMat);
    panelLMesh.position.set(-1.3,-0.2,-0.5); panelLMesh.rotation.y = 0.4; cockpit.add(panelLMesh);
    const panelRMesh = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.8,1.2), panelMat);
    panelRMesh.position.set(1.3,-0.2,-0.5); panelRMesh.rotation.y = -0.4; cockpit.add(panelRMesh);

    // Bottom console
    const consoleMat2 = new THREE.MeshBasicMaterial({ color: 0x1a2030, transparent: true, opacity: 0.5 });
    const consoleMesh = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.08,0.8), consoleMat2);
    consoleMesh.position.set(0,-0.6,-0.8); consoleMesh.rotation.x = -0.3; cockpit.add(consoleMesh);

    // Console screen glow
    const screenMat = new THREE.MeshBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.15 });
    const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4,0.6), screenMat);
    screenMesh.position.set(0,-0.55,-0.8); screenMesh.rotation.x = -0.3 + Math.PI; cockpit.add(screenMesh);

    camera.add(cockpit);
    scene.add(camera);

    // ================================================================
    //  ENEMY CREATION
    // ================================================================
    function createEnemy(type) {
      const types = {
        scout:       { color: 0xaa4444, scale: 0.6, hp: 2, points: 10, speed: 1.3 },
        fighter:     { color: 0xcc6644, scale: 1.0, hp: 4, points: 25, speed: 1.0 },
        bomber:      { color: 0x886644, scale: 1.5, hp: 8, points: 50, speed: 0.7 },
        interceptor: { color: 0xcc44aa, scale: 0.8, hp: 3, points: 15, speed: 1.6 },
      };
      const cfg = types[type] || types.fighter;

      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: cfg.color, roughness: 0.5, metalness: 0.7,
        emissive: cfg.color, emissiveIntensity: 0.25,
      });
      // Body
      g.add(new THREE.Mesh(new THREE.BoxGeometry(1.5*cfg.scale, 0.5*cfg.scale, 3*cfg.scale), mat));
      // Wings
      const wg = new THREE.BoxGeometry(4*cfg.scale, 0.1*cfg.scale, 1.5*cfg.scale);
      const ew1 = new THREE.Mesh(wg, mat); ew1.position.set(-2*cfg.scale,0,0); g.add(ew1);
      const ew2 = new THREE.Mesh(wg, mat); ew2.position.set(2*cfg.scale,0,0); g.add(ew2);
      // Engine glow
      const eg = new THREE.MeshBasicMaterial({ color: 0xff4422, transparent: true, opacity: 0.6 });
      const em = new THREE.Mesh(new THREE.CircleGeometry(0.3*cfg.scale,8), eg);
      em.position.set(0,0,1.6*cfg.scale); g.add(em);

      // Spawn from random direction
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos(2*Math.random()-1);
      const r = SPAWN_RADIUS + Math.random()*100;
      g.position.set(
        ship.position.x + r*Math.sin(phi)*Math.cos(theta),
        ship.position.y + r*Math.sin(phi)*Math.sin(theta) * 0.3,
        ship.position.z + r*Math.cos(phi)
      );
      g.lookAt(ship.position);

      scene.add(g);
      enemies.push({
        id: nextEnemyId++, group: g, hp: cfg.hp, maxHp: cfg.hp,
        speed: ENEMY_SPEED * cfg.speed, type: type, points: cfg.points, cfg: cfg,
        hitFlash: 0,
      });
    }

    // ================================================================
    //  FIRE RAILGUN
    // ================================================================
    function fireRailgun() {
      if (!weaponReady || ammo <= 0) return;
      weaponReady = false;
      charging = true;
      chargeStart = performance.now();
    }

    function spawnNail() {
      ammo--;
      heat = Math.min(1, heat + 0.12);
      recoilVel = -8;

      // Muzzle flash
      muzzleMat.opacity = 1;

      // Direction from camera
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      const origin = camera.position.clone().add(dir.clone().multiplyScalar(1));

      // Nail mesh
      const nailGeo = new THREE.CylinderGeometry(0.02, 0.015, 0.5, 6);
      const nailMat2 = new THREE.MeshBasicMaterial({ color: 0xaabbcc });
      const nail = new THREE.Mesh(nailGeo, nailMat2);
      nail.quaternion.copy(camera.quaternion);
      nail.rotateX(Math.PI/2);
      nail.position.copy(origin);

      // Trail
      const trailMat = new THREE.MeshBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.6 });
      const trail = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,2,4), trailMat);
      trail.quaternion.copy(nail.quaternion);
      trail.position.copy(origin);

      const g = new THREE.Group();
      g.add(nail); g.add(trail);
      scene.add(g);

      projectiles.push({
        id: nextProjId++, group: g, dir: dir.clone(),
        speed: NAIL_SPEED, life: 3000, age: 0, trailMat: trailMat,
      });

      addLog('Railgun fired', 'combat');
    }

    // ================================================================
    //  EXPLOSION EFFECT
    // ================================================================
    function spawnExplosion(pos, scale) {
      const g = new THREE.Group();
      const count = 8 + Math.floor(Math.random()*6);
      for (let i = 0; i < count; i++) {
        const mat = new THREE.MeshBasicMaterial({
          color: [0xff4422, 0xffaa00, 0xff6600, 0xffcc44][Math.floor(Math.random()*4)],
          transparent: true, opacity: 1,
        });
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.2 + Math.random()*0.3, 6, 6), mat);
        const dir = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
        m.userData = { dir: dir, speed: 15 + Math.random()*25 };
        g.add(m);
      }
      g.position.copy(pos);
      g.scale.setScalar(scale || 1);
      scene.add(g);
      explosions.push({ group: g, age: 0, maxAge: 600 });
    }

    // ================================================================
    //  LOG
    // ================================================================
    function addLog(msg, type) {
      logLines.push({ msg: msg, type: type, age: 0 });
      if (logLines.length > 10) logLines.shift();
    }

    // ================================================================
    //  INPUT
    // ================================================================
    canvas3d.addEventListener('mousedown', function(e) {
      if (!running) return;
      if (!locked) { canvas3d.requestPointerLock(); return; }
      if (e.button === 0) fireRailgun();
    });

    document.addEventListener('pointerlockchange', function() {
      locked = document.pointerLockElement === canvas3d;
      document.getElementById('lock-prompt').style.display = locked ? 'none' : (running ? 'flex' : 'none');
    });

    document.getElementById('lock-prompt').addEventListener('click', function() {
      canvas3d.requestPointerLock();
    });

    document.addEventListener('mousemove', function(e) {
      if (!locked || !running) return;
      yaw   = Math.max(-MAX_YAW,   Math.min(MAX_YAW,   yaw   - e.movementX * MOUSE_SENS));
      pitch = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitch + e.movementY * MOUSE_SENS));
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'r' || e.key === 'R') {
        ammo = MAX_AMMO;
        addLog('Reloaded', 'system');
      }
    });

    // ================================================================
    //  START GAME
    // ================================================================
    document.getElementById('btn-start').addEventListener('click', function() {
      document.getElementById('title-screen').style.display = 'none';
      running = true;
      canvas3d.requestPointerLock();
      addLog('Gunner mode activated', 'event');
      addLog('Mouse aim \u2014 Click to fire \u2014 R to reload', 'system');
    });

    // ================================================================
    //  HUD RENDERER
    // ================================================================
    function renderHUD() {
      var W = hudCanvas.width, H = hudCanvas.height;
      var cx = W/2, cy = H/2;
      hudCtx.clearRect(0, 0, W, H);

      if (!running) return;

      var primary = '#44aaff';
      var accent = '#00ff88';
      var warning = '#ffaa00';
      var danger = '#ff4444';

      // Crosshair
      hudCtx.strokeStyle = primary;
      hudCtx.lineWidth = 1.5;
      hudCtx.globalAlpha = 0.8;
      hudCtx.beginPath(); hudCtx.arc(cx, cy, 30, 0, Math.PI*2); hudCtx.stroke();
      hudCtx.fillStyle = primary; hudCtx.globalAlpha = 0.9;
      hudCtx.beginPath(); hudCtx.arc(cx, cy, 2, 0, Math.PI*2); hudCtx.fill();
      hudCtx.globalAlpha = 0.5;
      hudCtx.beginPath(); hudCtx.moveTo(cx-40, cy); hudCtx.lineTo(cx-15, cy); hudCtx.stroke();
      hudCtx.beginPath(); hudCtx.moveTo(cx+15, cy); hudCtx.lineTo(cx+40, cy); hudCtx.stroke();
      hudCtx.beginPath(); hudCtx.moveTo(cx, cy-40); hudCtx.lineTo(cx, cy-15); hudCtx.stroke();
      hudCtx.beginPath(); hudCtx.moveTo(cx, cy+15); hudCtx.lineTo(cx, cy+40); hudCtx.stroke();

      // Charge indicator
      if (charging) {
        hudCtx.strokeStyle = '#ffcc00';
        hudCtx.lineWidth = 3;
        hudCtx.globalAlpha = 0.9;
        hudCtx.beginPath();
        hudCtx.arc(cx, cy, 36, -Math.PI/2, -Math.PI/2 + chargeLevel*Math.PI*2);
        hudCtx.stroke();
      }

      hudCtx.globalAlpha = 1;

      // Weapon status (bottom-right)
      var wrx = W - 220, wry = H - 140;
      hudCtx.font = '11px "Segoe UI"';
      hudCtx.fillStyle = '#445566';
      hudCtx.fillText('WEAPON', wrx, wry);
      hudCtx.font = 'bold 16px "Segoe UI"';
      hudCtx.fillStyle = primary;
      hudCtx.fillText('RAILGUN MK-II', wrx, wry + 20);
      hudCtx.font = '11px "Segoe UI"';
      hudCtx.fillStyle = ammo > 6 ? accent : (ammo > 0 ? warning : danger);
      hudCtx.fillText('AMMO  ' + ammo + ' / ' + MAX_AMMO, wrx, wry + 42);
      hudCtx.fillStyle = '#1a1a2a';
      hudCtx.fillRect(wrx, wry+48, 180, 6);
      hudCtx.fillStyle = ammo > 6 ? accent : (ammo > 0 ? warning : danger);
      hudCtx.fillRect(wrx, wry+48, 180*(ammo/MAX_AMMO), 6);
      hudCtx.fillStyle = '#445566';
      hudCtx.fillText('HEAT', wrx, wry + 72);
      hudCtx.fillStyle = '#1a1a2a';
      hudCtx.fillRect(wrx + 40, wry+64, 140, 6);
      hudCtx.fillStyle = heat > 0.7 ? danger : (heat > 0.4 ? warning : primary);
      hudCtx.fillRect(wrx + 40, wry+64, 140*heat, 6);
      hudCtx.fillStyle = weaponReady ? accent : warning;
      hudCtx.fillText(weaponReady ? '\u25CF READY' : (charging ? '\u25D0 CHARGING' : '\u25CB COOLING'), wrx, wry + 92);

      // Shields and Hull (top-left)
      var slx = 24, sly = 30;
      hudCtx.font = '11px "Segoe UI"';
      hudCtx.fillStyle = '#445566';
      hudCtx.fillText('SHIELD', slx, sly);
      hudCtx.fillStyle = '#1a1a2a'; hudCtx.fillRect(slx, sly+6, 180, 8);
      hudCtx.fillStyle = shield > 30 ? '#44aaff' : danger;
      hudCtx.fillRect(slx, sly+6, 180*(shield/maxShield), 8);
      hudCtx.fillStyle = '#445566';
      hudCtx.fillText('HULL', slx, sly+32);
      hudCtx.fillStyle = '#1a1a2a'; hudCtx.fillRect(slx, sly+38, 180, 8);
      hudCtx.fillStyle = hp > 30 ? '#cc4444' : danger;
      hudCtx.fillRect(slx, sly+38, 180*(hp/maxHp), 8);
      hudCtx.fillStyle = '#778899';
      hudCtx.fillText(Math.floor(shield)+'%', slx+185, sly+14);
      hudCtx.fillText(Math.floor(hp)+'%', slx+185, sly+46);

      // Score (top-right)
      var srx = W - 200, sry = 30;
      hudCtx.font = '11px "Segoe UI"';
      hudCtx.fillStyle = '#445566';
      hudCtx.fillText('SCORE', srx, sry);
      hudCtx.font = 'bold 22px "Segoe UI"';
      hudCtx.fillStyle = '#d4a856';
      hudCtx.fillText(score.toLocaleString(), srx, sry + 26);
      hudCtx.font = '11px "Segoe UI"';
      hudCtx.fillStyle = '#445566';
      hudCtx.fillText('KILLS ' + kills + '  |  CYCLE ' + cycle, srx, sry + 44);

      // Log (bottom-left)
      var lly = H - 24;
      hudCtx.font = '12px "Segoe UI"';
      for (var i = logLines.length-1, y=0; i >= 0 && y < 8; i--, y++) {
        var l = logLines[i];
        var alpha = Math.max(0, 1 - l.age/8000);
        hudCtx.globalAlpha = alpha;
        hudCtx.fillStyle = l.type==='combat'?danger : l.type==='event'?'#d4a856' : '#556688';
        hudCtx.fillText('> ' + l.msg, 24, lly - y*18);
      }
      hudCtx.globalAlpha = 1;

      // Scanlines
      hudCtx.globalAlpha = 0.03;
      hudCtx.fillStyle = '#44aaff';
      for (var sy = 0; sy < H; sy += 4) {
        hudCtx.fillRect(0, sy, W, 1);
      }
      hudCtx.globalAlpha = 1;

      // Corner brackets
      hudCtx.strokeStyle = '#334455';
      hudCtx.lineWidth = 1;
      hudCtx.globalAlpha = 0.4;
      var bl = 40;
      hudCtx.beginPath(); hudCtx.moveTo(10,10+bl); hudCtx.lineTo(10,10); hudCtx.lineTo(10+bl,10); hudCtx.stroke();
      hudCtx.beginPath(); hudCtx.moveTo(W-10-bl,10); hudCtx.lineTo(W-10,10); hudCtx.lineTo(W-10,10+bl); hudCtx.stroke();
      hudCtx.beginPath(); hudCtx.moveTo(10,H-10-bl); hudCtx.lineTo(10,H-10); hudCtx.lineTo(10+bl,H-10); hudCtx.stroke();
      hudCtx.beginPath(); hudCtx.moveTo(W-10-bl,H-10); hudCtx.lineTo(W-10,H-10); hudCtx.lineTo(W-10,H-10-bl); hudCtx.stroke();
      hudCtx.globalAlpha = 1;
    }

    // ================================================================
    //  GAME LOOP
    // ================================================================
    var clock = new THREE.Clock();

    function gameLoop() {
      requestAnimationFrame(gameLoop);
      var dt = clock.getDelta();
      var dtMs = dt * 1000;
      gameTime += dtMs;

      if (!running) { renderer.render(scene, camera); return; }

      // Camera from mouse look
      var worldPos = new THREE.Vector3();
      turretMount.getWorldPosition(worldPos);
      camera.position.copy(worldPos);

      var shipQuat = new THREE.Quaternion();
      ship.getWorldQuaternion(shipQuat);
      var lookEuler = new THREE.Euler(-pitch, -yaw, 0, 'YXZ');
      var lookQuat = new THREE.Quaternion().setFromEuler(lookEuler);
      camera.quaternion.copy(shipQuat).multiply(lookQuat);

      // Weapon logic
      if (charging) {
        chargeLevel = Math.min(1, (performance.now() - chargeStart) / CHARGE_TIME);
        railGlowMatL.opacity = chargeLevel * 0.8;
        railGlowMatR.opacity = chargeLevel * 0.8;
        if (chargeLevel >= 1) {
          charging = false;
          cooling = true;
          coolEnd = performance.now() + COOLDOWN_TIME;
          chargeLevel = 0;
          railGlowMatL.opacity = 0;
          railGlowMatR.opacity = 0;
          spawnNail();
        }
      }
      if (cooling && performance.now() >= coolEnd) {
        cooling = false;
        weaponReady = true;
      }

      // Muzzle flash fade
      if (muzzleMat.opacity > 0) muzzleMat.opacity = Math.max(0, muzzleMat.opacity - dt * 8);

      // Recoil physics
      if (Math.abs(recoilOffset) > 0.001 || Math.abs(recoilVel) > 0.001) {
        var spring = -15 * recoilOffset;
        var damp = -0.8 * recoilVel;
        recoilVel += (spring + damp) * dt;
        recoilOffset += recoilVel * dt;
        if (Math.abs(recoilOffset) < 0.001 && Math.abs(recoilVel) < 0.001) {
          recoilOffset = 0; recoilVel = 0;
        }
      }
      railL.position.z = -2.0 + recoilOffset;
      railR.position.z = -2.0 + recoilOffset;

      // Heat decay
      heat = Math.max(0, heat - dt * 0.15);

      // Spawn enemies
      if (gameTime - lastSpawn > SPAWN_INTERVAL) {
        lastSpawn = gameTime;
        var etypes = ['scout','fighter','bomber','interceptor'];
        var etype = etypes[Math.floor(Math.random()*etypes.length)];
        createEnemy(etype);
        if (kills > 0 && kills % 15 === 0) {
          cycle++;
          addLog('Cycle ' + cycle + ' \u2014 hostiles intensifying', 'event');
        }
      }

      // Update projectiles
      for (var i = projectiles.length - 1; i >= 0; i--) {
        var p = projectiles[i];
        p.age += dtMs;
        p.group.position.addScaledVector(p.dir, p.speed * dt);
        p.trailMat.opacity = Math.max(0, 0.6 - p.age/3000);

        var hitEnemy = false;
        for (var j = enemies.length - 1; j >= 0; j--) {
          var e = enemies[j];
          var dist = p.group.position.distanceTo(e.group.position);
          if (dist < 3 * (e.cfg.scale || 1)) {
            e.hp--;
            e.hitFlash = 150;
            if (e.hp <= 0) {
              score += e.points;
              kills++;
              spawnExplosion(e.group.position.clone(), e.cfg.scale);
              scene.remove(e.group);
              enemies.splice(j, 1);
              addLog(e.type + ' destroyed (+' + e.points + ')', 'combat');
            }
            hitEnemy = true;
            break;
          }
        }

        if (hitEnemy || p.age > p.life) {
          scene.remove(p.group);
          projectiles.splice(i, 1);
        }
      }

      // Update enemies
      for (var ei = enemies.length - 1; ei >= 0; ei--) {
        var en = enemies[ei];
        var edir = new THREE.Vector3().subVectors(ship.position, en.group.position).normalize();
        en.group.position.addScaledVector(edir, en.speed * dt);
        en.group.lookAt(ship.position);

        if (en.hitFlash > 0) {
          en.hitFlash -= dtMs;
          en.group.children.forEach(function(c) {
            if (c.material && c.material.emissiveIntensity !== undefined) {
              c.material.emissiveIntensity = en.hitFlash > 0 ? 1.5 : 0.25;
            }
          });
        }

        var distToShip = en.group.position.distanceTo(ship.position);
        if (distToShip < 5) {
          var dmg = en.cfg.scale * 8;
          if (shield > 0) {
            shield = Math.max(0, shield - dmg);
            addLog('Shield hit! -' + Math.floor(dmg), 'combat');
          } else {
            hp = Math.max(0, hp - dmg);
            addLog('Hull breach! -' + Math.floor(dmg), 'combat');
          }
          spawnExplosion(en.group.position.clone(), 0.5);
          scene.remove(en.group);
          enemies.splice(ei, 1);
          if (hp <= 0) {
            addLog('Ship destroyed \u2014 rebirth cycle initiated', 'event');
            hp = maxHp; shield = maxShield; ammo = MAX_AMMO;
            score = Math.floor(score * 0.7);
            cycle++;
          }
        }
      }

      // Update explosions
      for (var xi = explosions.length - 1; xi >= 0; xi--) {
        var ex = explosions[xi];
        ex.age += dtMs;
        var t = ex.age / ex.maxAge;
        ex.group.children.forEach(function(c) {
          if (c.userData.dir) {
            c.position.addScaledVector(c.userData.dir, c.userData.speed * dt * (1 - t));
          }
          if (c.material) {
            c.material.opacity = Math.max(0, 1 - t);
            c.scale.setScalar(1 + t * 2);
          }
        });
        if (ex.age >= ex.maxAge) {
          scene.remove(ex.group);
          explosions.splice(xi, 1);
        }
      }

      // Shield regen
      shield = Math.min(maxShield, shield + dt * 2);

      // Age log
      logLines.forEach(function(l) { l.age += dtMs; });

      // Render
      renderer.render(scene, camera);
      renderHUD();
    }

    gameLoop();
  </script>
