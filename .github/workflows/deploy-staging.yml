name: Deploy Staging Environment

on:
  push:
    branches: [staging, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preview

# Allows deployment even for private repos
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true  # Pull Git LFS files (GLB models, etc.)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true  # Don't fail deployment if tests fail

      - name: Create staging build info
        run: |
          cat > public/build-info.json << EOF
          {
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "gitCommit": "${{ github.sha }}",
            "gitBranch": "${{ github.ref_name }}",
            "gitAuthor": "${{ github.actor }}",
            "environment": "${{ inputs.environment || 'staging' }}"
          }
          EOF

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-build
          path: |
            public/
            src/
            package.json
            package-lock.json
            .env.example
          retention-days: 30

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment on PR with staging URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Staging deployment complete!**\n\n🔗 Preview URL: ${{ steps.deployment.outputs.page_url }}\n\n📦 Build info:\n- Commit: ${{ github.sha }}\n- Branch: ${{ github.ref_name }}\n- Deployed by: ${{ github.actor }}`
            })
